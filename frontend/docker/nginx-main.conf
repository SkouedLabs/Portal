# Main nginx configuration — runs as an unprivileged user (uid 101) on a read-only root filesystem.
# Everything nginx writes at runtime lives in /tmp (tmpfs): pid file, temp files and the
# server configuration rendered from the template at startup.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    # Rendered by the image entrypoint from /etc/nginx/templates (envsubst)
    include /tmp/nginx/conf.d/*.conf;
}
