# Networks allowed to reach the Portal-NG administration (UI route /admin and API /api/admin/).
# Install as /etc/nginx/snippets/portal-ng-admin-allow.conf (NOT in conf.d: it would apply to the
# whole server). Edit to match your administration networks / jump hosts, then:
#   sudo nginx -t && sudo systemctl reload nginx
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny  all;
