# Portal-NG behind nginx installed on the host (not in Docker).
#
#   sudo cp portal-ng.conf /etc/nginx/conf.d/
#   sudo mkdir -p /etc/nginx/snippets && sudo cp admin-allow.conf /etc/nginx/snippets/portal-ng-admin-allow.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Portal-NG side (docker-compose / quadlet): frontend published on 127.0.0.1:8080 (default),
# PUBLIC_URL=https://portal.example.internal
#
# - TLS 1.3 only, post-quantum hybrid key exchange X25519MLKEM768 first (needs OpenSSL >= 3.5:
#   Debian 13, Ubuntu 25.04+, RHEL 10, Alpine 3.22… check with `openssl version`)
# - IP allow-list on the administration (UI route and API)
# - real client IP passed to Portal-NG (X-Forwarded-For), which trusts 127.0.0.1 by default

upstream portal_ng {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Empty Connection header unless upgrading: keeps upstream keep-alive connections usable
map $http_upgrade $portal_ng_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.example.internal;

    # Certificate of your PKI (demo: example/pki/gen-certs.sh)
    ssl_certificate     /etc/nginx/ssl/portal.crt;
    ssl_certificate_key /etc/nginx/ssl/portal.key;

    ssl_protocols       TLSv1.3;
    # OpenSSL >= 3.5. With an older OpenSSL, nginx refuses this line: use "X25519:secp384r1"
    # (TLS 1.3 stays secure today, but without post-quantum key exchange).
    ssl_ecdh_curve      X25519MLKEM768:X25519:secp384r1;
    ssl_session_cache   shared:PORTAL_NG_SSL:10m;
    ssl_session_tickets off;

    # Portal-NG sends its own security headers (CSP, X-Frame-Options…); HSTS belongs to the TLS layer
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $portal_ng_connection;

    # --- Administration: IP allow-list ------------------------------------------------
    # /admin is a client-side route (same HTML as the rest of the app): the protection that
    # matters is on the API. Both are filtered.
    location ^~ /api/admin/ {
        include /etc/nginx/snippets/portal-ng-admin-allow.conf;
        proxy_pass http://portal_ng;
    }
    location ^~ /admin {
        include /etc/nginx/snippets/portal-ng-admin-allow.conf;
        proxy_pass http://portal_ng;
    }

    location / {
        proxy_pass http://portal_ng;
    }

    error_page 403 /portal-ng-403.html;
    location = /portal-ng-403.html {
        internal;
        default_type text/html;
        return 403 '<!doctype html><meta charset="utf-8"><title>Forbidden</title><body style="font-family:sans-serif;text-align:center;padding:10vh 16px"><h1>403</h1><p>The administration is only reachable from the administration network.</p><p><a href="/">Back to the portal</a></p></body>';
    }
}
